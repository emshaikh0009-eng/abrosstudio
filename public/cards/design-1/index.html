<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Business Card | Ambros Studio</title>
  <meta name="description" content="Digital business card by Ambros Studio.">
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      if (p.get('slug') || p.get('id')) {
        document.documentElement.classList.add('card-loading');
        document.title = 'Digital Business Card | Ambros Studio';
      }
    })();
  </script>
  <link rel="stylesheet" href="/cards/design-1/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- Mobile-first Viewport Container -->
  <main class="viewport-wrapper" role="main">

    <!-- Dynamic Loading Skeleton (Displayed only while loading customer data) -->
    <div id="cardSkeleton" class="card-skeleton" aria-hidden="true">
      <div class="skeleton-avatar"></div>
      <div class="skeleton-line skeleton-name"></div>
      <div class="skeleton-line skeleton-role"></div>
      <div class="skeleton-line skeleton-company"></div>
      <div class="skeleton-line skeleton-bio-1"></div>
      <div class="skeleton-line skeleton-bio-2"></div>
      <div class="skeleton-btn"></div>
      <div class="skeleton-cards">
        <div class="skeleton-card">
          <div class="skeleton-card-icon"></div>
          <div class="skeleton-card-text">
            <div class="skeleton-card-label"></div>
            <div class="skeleton-card-val"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-card-icon"></div>
          <div class="skeleton-card-text">
            <div class="skeleton-card-label"></div>
            <div class="skeleton-card-val"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-card-icon"></div>
          <div class="skeleton-card-text">
            <div class="skeleton-card-label"></div>
            <div class="skeleton-card-val"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-card-icon"></div>
          <div class="skeleton-card-text">
            <div class="skeleton-card-label"></div>
            <div class="skeleton-card-val"></div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 1. Profile Header -->
    <header class="profile-section">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar-initials-fallback" style="display: flex; width: 88px; height: 88px; border-radius: 50%; background: #fef3c7; color: #92400e; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; margin: 0 auto; box-shadow: 0 4px 14px rgba(0,0,0,0.08);">
          AS
        </div>
        <span class="profile-badge-active" title="Available for projects" aria-hidden="true"></span>
      </div>

      <h1 class="profile-name">Ambros Studio Member</h1>
      <p class="profile-designation"></p>
      <p class="profile-company"></p>

      <p class="profile-bio"></p>

      <!-- Actions CTA Wrap -->
      <div class="profile-actions-wrap">
        <button type="button" class="btn-save-contact" id="saveContactBtn" aria-label="Save contact to phone">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <line x1="19" y1="8" x2="19" y2="14"></line>
            <line x1="22" y1="11" x2="16" y2="11"></line>
          </svg>
          <span>Save Contact</span>
        </button>

        <div class="secondary-actions-row">
          <button type="button" class="btn-action-secondary" id="shareCardBtn" aria-label="Share card">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span class="btn-action-label">Share</span>
          </button>

          <button type="button" class="btn-action-secondary" id="showQrBtn" aria-label="View QR code">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span class="btn-action-label">QR Code</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 2. Get in touch Section -->
    <section class="get-in-touch-section" aria-label="Get in touch options">
      <h2 class="section-title">Get in touch</h2>
      <div class="contact-list">
        <!-- Call -->
        <a href="tel:" class="contact-card" style="display: none;" aria-label="Phone number">
          <div class="contact-card-left">
            <div class="badge-icon badge-green" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">Call</span>
              <span class="contact-value"></span>
            </div>
          </div>
          <svg class="card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/" class="contact-card" target="_blank" rel="noopener noreferrer" style="display: none;" aria-label="WhatsApp">
          <div class="contact-card-left">
            <div class="badge-icon badge-blue" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
              </svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">WhatsApp</span>
              <span class="contact-value">Message on WhatsApp</span>
            </div>
          </div>
          <svg class="card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>

        <!-- Email -->
        <a href="mailto:" class="contact-card" style="display: none;" aria-label="Email">
          <div class="contact-card-left">
            <div class="badge-icon badge-yellow" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">Email</span>
              <span class="contact-value"></span>
            </div>
          </div>
          <svg class="card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>

        <!-- Website -->
        <a href="#" class="contact-card contact-card-website" target="_blank" rel="noopener noreferrer" style="display: none;" aria-label="Website">
          <div class="contact-card-left">
            <div class="badge-icon badge-purple" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">Website</span>
              <span class="contact-value"></span>
            </div>
          </div>
          <svg class="card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
      </div>
    </section>

    <!-- 3. Business Details Card -->
    <section class="business-section" aria-label="Business details" style="display: none;">
      <h2 class="section-title">Business Details</h2>
      <div class="business-card">
        <div class="detail-group detail-group-company" style="display: none;">
          <span class="detail-label">Company</span>
          <span class="detail-value studio-name"></span>
        </div>

        <div class="detail-group detail-group-designation" style="display: none;">
          <span class="detail-label">Role</span>
          <span class="detail-value"></span>
        </div>

        <div class="detail-group detail-group-address" style="display: none;">
          <span class="detail-label">Address</span>
          <address class="detail-value" style="font-style: normal;"></address>
        </div>

        <div class="detail-group detail-group-website" style="display: none;">
          <span class="detail-label">Website</span>
          <a href="#" target="_blank" rel="noopener noreferrer" class="detail-value detail-link"></a>
        </div>
      </div>
    </section>

    <!-- 4. Social Section -->
    <section class="social-section" aria-label="Social media profiles" style="display: none;">
      <h2 class="section-title">Social</h2>
      <div class="social-grid">
        <!-- Instagram -->
        <a href="#" class="social-card social-card-instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile" style="display: none;">
          <div class="badge-icon badge-peach" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </div>
          <span class="social-label">Instagram</span>
        </a>

        <!-- Facebook -->
        <a href="#" class="social-card social-card-facebook" target="_blank" rel="noopener noreferrer" aria-label="Facebook profile" style="display: none;">
          <div class="badge-icon badge-purple" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
            </svg>
          </div>
          <span class="social-label">Facebook</span>
        </a>

        <!-- LinkedIn -->
        <a href="#" class="social-card social-card-linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile" style="display: none;">
          <div class="badge-icon badge-blue" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
          </div>
          <span class="social-label">LinkedIn</span>
        </a>
      </div>
    </section>

  </main>

  <!-- Dynamic Card Hydration Controller -->
  <script src="/cards/qrcode.js"></script>
  <script src="/cards/card-loader.js"></script>

  <!-- QR Modal Dialog -->
  <div id="qrModalBackdrop" class="qr-modal-backdrop" aria-hidden="true">
    <div class="qr-modal-card" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
      <button type="button" class="qr-modal-close" id="qrModalCloseBtn" aria-label="Close QR dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <h3 id="qrModalTitle" class="qr-modal-title">Digital Business Card</h3>
      <p id="qrModalSub" class="qr-modal-sub">Scan to connect or save this business card</p>
      <div class="qr-modal-qr-wrap" id="qrModalCanvasContainer">
        <!-- Live dynamic QR generated from canonical card URL -->
      </div>
      <div class="qr-modal-url" id="qrModalUrlText"></div>
      <div class="qr-modal-actions">
        <button type="button" class="btn-qr-download" id="qrDownloadPngBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Download QR (PNG)</span>
        </button>
        <button type="button" class="btn-qr-download-alt" id="qrDownloadSvgBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Download Vector (SVG)</span>
        </button>
        <button type="button" class="btn-qr-download-alt" id="qrCopyLinkBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span id="qrCopyLinkText">Copy Card Link</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Global Action Toast Feedback -->
  <div id="cardToast" class="card-toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    <span id="cardToastMessage">Link copied to clipboard</span>
  </div>

</body>
</html>
